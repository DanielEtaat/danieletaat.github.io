<article class="post-entry">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%B %d, %Y' }}</time>
  <h2><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  {% if include.post.description %}<p>{{ include.post.description }}</p>{% endif %}
  <a class="text-link" href="{{ include.post.url | relative_url }}">Read essay <span aria-hidden="true">→</span></a>
</article>
