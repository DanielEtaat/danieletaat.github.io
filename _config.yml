title: "Daniel Etaat"
description: "Statistics Ph.D. student at Columbia University working on modern machine learning, uncertainty, and high-dimensional statistics."
url: "https://danieletaat.github.io"
baseurl: ""
repository: "DanielEtaat/danieletaat.github.io"
theme: null
lang: "en-US"
timezone: "America/New_York"

author:
  name: "Daniel Etaat"
  email_display: "dbe2117 (at) columbia (dot) edu"

markdown: kramdown
highlighter: rouge
permalink: pretty
future: true
excerpt_separator: "\n\n"

collections:
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
