layout: default
---
<article class="page-shell publication-page"><a class="back-link" href="{{ '/publications/' | relative_url }}">← Research index</a><header class="page-heading"><p class="eyebrow">Research · {{ page.year }}</p><h1>{{ page.title }}</h1><p class="page-deck">{{ page.description }}</p></header><dl class="publication-facts"><div><dt>Authors</dt><dd>{{ page.authors }}</dd></div><div><dt>Venue</dt><dd>{{ page.venue }}, {{ page.year }}</dd></div></dl><a class="primary-link" href="{{ page.link }}">Visit the project ↗</a><div class="prose">{{ content }}</div></article>
